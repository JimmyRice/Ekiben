name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kippu
          POSTGRES_PASSWORD: kippu
          POSTGRES_DB: kippu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kippu" --health-interval 2s --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kippu
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pkippu" --health-interval 2s --health-timeout 5s
          --health-retries 60
    env:
      EKIBEN_TEST_POSTGRES_URL: postgres://kippu:kippu@localhost:5432/kippu
      EKIBEN_TEST_MYSQL_URL: mysql://root:kippu@127.0.0.1:3306/mysql
      EKIBEN_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Default features too: optional ones (e.g. `base45`) must not be load-bearing.
      - run: cargo clippy --workspace --all-targets
      # Service containers cannot take arguments, and NATS needs `-js` for JetStream.
      - run: docker run -d -p 4222:4222 nats:2.11-alpine -js
      - run: cargo test --workspace --all-features
      # The HTTP tests again, on a database with concurrent writers.
      - run: cargo test --package kippu-core
        env:
          EKIBEN_TEST_BACKEND: postgres
      - run: cargo test --package kippu-core
        env:
          EKIBEN_TEST_BACKEND: mysql

  kaisatsu:
    name: kaisatsu · no_std · C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package kaisatsu --target thumbv7em-none-eabihf
      - run: cargo build --package kaisatsu-ffi --no-default-features --target thumbv7em-none-eabihf --profile release-small
      - run: cargo xtask vectors --check
      - run: cargo xtask header --check
      - run: cargo xtask c-example
      - run: cargo xtask size

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
