[package]
name = "kaisatsu-ffi"
description = "C ABI for Kaisatsu: verify Kippu tickets from C, C++, C#, Swift or firmware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kaisatsu"
crate-type = ["staticlib", "cdylib"]

[features]
default = ["std"]
## Link the standard library. Disable for bare-metal targets, which then get a minimal
## panic handler (Kaisatsu itself never panics).
std = []
## Export `kaisatsu_base45_decode`. Define `KAISATSU_BASE45` before including the header to
## declare it.
base45 = ["kaisatsu/base45"]

[dependencies]
kaisatsu.workspace = true

[lints]
workspace = true
