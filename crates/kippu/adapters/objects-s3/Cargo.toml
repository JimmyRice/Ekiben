[package]
name = "kippu-objects-s3"
description = "Amazon S3 and S3-compatible services (MinIO, Cloudflare R2, Alibaba OSS, SeaweedFS, …) as Kippu's object storage (event images)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kippu-objects-common.workspace = true
kippu-store.workspace = true
object_store = { workspace = true, features = ["aws-base"] }

[dev-dependencies]
kippu-store = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
