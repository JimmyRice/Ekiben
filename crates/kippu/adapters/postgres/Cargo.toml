[package]
name = "kippu-store-postgres"
description = "PostgreSQL storage adapter for Kippu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
kippu-domain.workspace = true
kippu-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros", "uuid", "time", "json"] }
time.workspace = true
uuid.workspace = true

[dev-dependencies]
kippu-store = { workspace = true, features = ["conformance"] }
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
