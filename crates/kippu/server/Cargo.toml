[package]
name = "kippu-server"
description = "Launcher for Kippu: CLI, configuration sources and adapter wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["sqlite"]
## SQLite storage adapter.
sqlite = ["dep:kippu-store-sqlite"]

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek = { workspace = true, features = ["pem", "zeroize"] }
figment = { workspace = true, features = ["toml", "env"] }
getrandom.workspace = true
hex.workspace = true
kaisatsu.workspace = true
kippu-core.workspace = true
kippu-domain.workspace = true
kippu-store.workspace = true
kippu-store-sqlite = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
kaisatsu = { workspace = true, features = ["issuer"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
