language = "C"
header = """/*
 * Kaisatsu (改札) — verify tickets issued by Kippu.
 *
 * Generated by `cargo xtask header`; do not edit.
 *
 *     KaisatsuKey keys[] = {{ .public_key = { ... } }};
 *     KaisatsuTicket ticket;
 *     KaisatsuStatus status = kaisatsu_verify(keys, 1, bytes, len, &ticket);
 *     if (status != KAISATSU_STATUS_OK) puts(kaisatsu_status_message(status));
 */"""
include_guard = "KAISATSU_H"
cpp_compat = true
usize_is_size_t = true
style = "type"
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["KaisatsuStatus"]
